# AquaFishing - Modern Balıkçılık Turnuvası ve Özel Balık Konfigürasyonu
# Renkler için Paper Adventure MiniMessage formatı desteklenir: <green>, <yellow>, <gradient:#color1:#color2>, <b> vb.

settings:
  # Turnuva varsayılan süresi (saniye cinsinden, 300 = 5 dakika)
  default-duration-seconds: 300
  # Otomatik turnuva sistemi
  auto-contest:
    enabled: true
    interval-seconds: 3600 # 60 dakikada bir
    min-players: 1
  # BossBar ayarları
  bossbar:
    enabled: true
    title: "<gradient:#00c6ff:#0072ff><b>BALIK TURNUVASI</b></gradient> <dark_gray>| <gray>Süre: <yellow>{time} <dark_gray>| <gray>Lider: <aqua>{leader} <gray>(<white>{weight} kg<gray>)"
    color: "BLUE" # BLUE, GREEN, PINK, PURPLE, RED, WHITE, YELLOW
    style: "PROGRESS" # PROGRESS, NOTCHED_6, NOTCHED_10, NOTCHED_12, NOTCHED_20
  # Veritabanı ve Kalıcı Kayıt Seçeneği (SQLITE veya YAML)
  database:
    type: "SQLITE" # Seçenekler: SQLITE, YAML

messages:
  prefix: "<gradient:#00c6ff:#0072ff><b>AquaFishing</b></gradient> <dark_gray>» <gray>"
  contest-start: "<newline><gold>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━<newline>  <gradient:#00c6ff:#0072ff><b>BALIKÇILIK TURNUVASI BAŞLADI!</b></gradient><newline>  <gray>En ağır balığı tutan ilk 3 kişi ödüllendirilecek!<newline>  <gray>Turnuva Süresi: <yellow>{duration}<newline><gold>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━<newline>"
  contest-end: "<newline><gold>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━<newline>  <gradient:#00c6ff:#0072ff><b>BALIKÇILIK TURNUVASI SONA ERDİ!</b></gradient><newline>{winners}<newline><gold>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━<newline>"
  contest-no-winners: "  <red>Hiç kimse turnuva süresince balık tutamadı!"
  winner-format: "  <yellow>#{rank} <white>{player} <dark_gray>- <aqua>{fish} <gray>(<yellow>{weight} kg<gray>)"
  new-first-place: "{prefix}<yellow><b>{player}</b> <gray>yeni bir rekor kırdı! <aqua>{fish} <gray>(<white>{weight} kg<gray>) ile <green>1. sıraya <gray>yerleşti!"
  fish-caught: "{prefix}Tuttuğun balık: {rarity} <b>{fish}</b> <gray>(Ağırlık: <yellow>{weight} kg<gray>)"
  contest-not-active: "{prefix}<red>Şu anda aktif bir balık turnuvası yok."
  contest-already-active: "{prefix}<red>Zaten devam eden bir turnuva var! Kalan süre: <yellow>{time}"
  no-permission: "{prefix}<red>Bu komutu kullanmak için yetkiniz yok!"
  reload-success: "{prefix}<green>Konfigürasyon dosyaları başarıyla yenilendi!"

rewards:
  1:
    commands:
      - "give {player} gold_ingot 64"
      - "tellraw {player} {\"text\":\"§6[Turnuva Ödülü] §a1. olduğun için 64 Altın Külçesi kazandın!\"}"
  2:
    commands:
      - "give {player} gold_ingot 32"
      - "tellraw {player} {\"text\":\"§6[Turnuva Ödülü] §a2. olduğun için 32 Altın Külçesi kazandın!\"}"
  3:
    commands:
      - "give {player} gold_ingot 16"
      - "tellraw {player} {\"text\":\"§6[Turnuva Ödülü] §a3. olduğun için 16 Altın Külçesi kazandın!\"}"

