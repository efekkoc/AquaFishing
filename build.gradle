plugins {
    id 'java'
}

group = 'me.furkankoc.aquafishing'
version = '1.0.0-SNAPSHOT'

// Fix for Windows non-ASCII user home paths corrupting Gradle worker classpaths
boolean isAscii = projectDir.getAbsolutePath().chars().allMatch { it < 128 }
if (System.getProperty("os.name").toLowerCase().contains("windows") && !isAscii) {
    layout.buildDirectory.set(file("C:/Users/Public/AquaFishing-build"))
}

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
}

dependencies {
    compileOnly("io.papermc.paper:paper-api:1.21.1-R0.1-SNAPSHOT")
    testImplementation("io.papermc.paper:paper-api:1.21.1-R0.1-SNAPSHOT")

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    jvmArgs "-Dfile.encoding=UTF-8", "-Dsun.jnu.encoding=UTF-8"
    testLogging {
        events "passed", "skipped", "failed"
    }
}

def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    toolchain {
        languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(targetJavaVersion)
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

// Jar üretildiğinde test-server/plugins içine otomatik kopyalama görevi
tasks.register('copyToServer', Copy) {
    dependsOn tasks.named('jar')
    from layout.buildDirectory.file('libs/AquaFishing-1.0.0-SNAPSHOT.jar')
    into layout.projectDirectory.dir('test-server/plugins')
}

tasks.named('build') {
    finalizedBy tasks.named('copyToServer')
}
